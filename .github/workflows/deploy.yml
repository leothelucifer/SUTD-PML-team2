# Deploys to AWS: build once, then dev -> staging -> prod, each from the same commit.
# Started by hand only (Actions -> deploy -> Run workflow).
#
# Works in any AWS account with no edits here. Each GitHub environment (dev, staging, prod)
# needs two variables, set by scripts/bootstrap_github_oidc.sh or by hand:
#   AWS_REGION            region of the account, for example ap-southeast-2
#   AWS_DEPLOY_ROLE_ARN   the deploy role that the bootstrap stack created for that environment
# Optional: BUDGET_EMAIL (needed when infra/params/<env>.json sets a monthly budget), ALERT_EMAIL.
# No long-lived AWS keys are used: GitHub's OIDC token is exchanged for a short-lived role.
# "staging" and "prod" should be GitHub environments with required reviewers, which is the
# approval step. Changes to this file need owner review.
name: deploy

on:
  workflow_dispatch:
    inputs:
      model_uri:
        description: Registered model to deploy (must already be promoted in the account's MLflow App)
        default: models:/sepsis-warning@production
      environments:
        description: How far to go
        type: choice
        options: [dev, dev+staging, dev+staging+prod]
        default: dev

permissions:
  contents: read
  id-token: write   # OIDC token for AWS; no stored credentials

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    strategy:
      max-parallel: 1          # one environment at a time, in order
      fail-fast: true          # a failed smoke test stops the promotion
      matrix:
        environment: [dev, staging, prod]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ matrix.environment }}
    steps:
      - name: Decide whether this environment is requested
        id: gate
        run: |
          case "${{ inputs.environments }}:${{ matrix.environment }}" in
            dev:dev|dev+staging:dev|dev+staging:staging|dev+staging+prod:*) run=true ;;
            *) run=false ;;
          esac
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Check the environment's variables
        id: check
        if: steps.gate.outputs.run == 'true'
        run: |
          missing=""
          [ -n "${{ vars.AWS_REGION }}" ] || missing="$missing AWS_REGION"
          [ -n "${{ vars.AWS_DEPLOY_ROLE_ARN }}" ] || missing="$missing AWS_DEPLOY_ROLE_ARN"
          if [ -n "$missing" ]; then
            echo "The '${{ matrix.environment }}' environment is missing:$missing" >&2
            echo "Run scripts/bootstrap_github_oidc.sh for this account, or set them in GitHub settings." >&2
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.gate.outputs.run == 'true'
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        if: steps.gate.outputs.run == 'true'
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install the deploy tools (locked)
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps -e .
          python -m pip install "sagemaker-mlflow>=0.5,<1"

      - name: Stack, images, publish, deploy
        if: steps.gate.outputs.run == 'true'
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          # Prod changes need this confirmation; the environment's required reviewers are the approval.
          CONFIRM_PROD: ${{ matrix.environment == 'prod' && 'yes' || '' }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          BUDGET_EMAIL: ${{ vars.BUDGET_EMAIL }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          MODEL_URI: ${{ inputs.model_uri }}
          TAG: ${{ github.sha }}
        run: |
          bash scripts/aws_deploy.sh stack
          bash scripts/aws_deploy.sh images
          bash scripts/aws_deploy.sh publish
          bash scripts/aws_deploy.sh serve

      # The canary inside the stack update already rolled back on errors; this checks the result.
      - name: Smoke test the deployed API
        if: steps.gate.outputs.run == 'true'
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          bash scripts/aws_deploy.sh call GET /health
          bash scripts/aws_deploy.sh call POST /predict \
            '{"stays": [{"patient_id": "smoke-1", "hours": [{"ICULOS": 1, "HR": 92}, {"ICULOS": 2, "HR": 118}]}]}'
