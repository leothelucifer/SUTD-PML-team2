# Deploys to AWS from GitHub Actions: pick the environment and the region when you start it.
# Started by hand only (Actions -> deploy -> Run workflow).
#
# Works in any AWS account with no edits here. The AWS account of each GitHub environment
# (dev, staging, prod) is set once by scripts/bootstrap_github_oidc.sh, which sets:
#   AWS_ACCOUNT_ID        the account that GitHub environment deploys into
#   AWS_REGION            the default region, used when you pick "environment default"
#   AWS_DEPLOY_ROLE_ARN   the role created by the bootstrap in that default region
# Run the bootstrap once for each region you want to deploy to. The role it creates is named
# github-deploy-<environment>-<region>, so this workflow finds the right role for the region
# you choose from AWS_ACCOUNT_ID alone. Regions offered: ap-southeast-1 (Singapore) and
# ap-southeast-2 (Sydney).
# Optional variables: BUDGET_EMAIL (needed when infra/params/<env>.json sets a monthly budget), ALERT_EMAIL.
# No long-lived AWS keys are used: GitHub's OIDC token is exchanged for a short-lived role.
# "staging" and "prod" should be GitHub environments with required reviewers, which is the
# approval step. Changes to this file need owner review.
name: deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy (staging and prod wait for their reviewers)
        type: choice
        options: [dev, staging, prod]
        default: dev
      region:
        description: AWS region (the bootstrap must have been run for it in that account)
        type: choice
        options: [environment default, ap-southeast-1, ap-southeast-2]
        default: environment default
      steps:
        description: First deploy in an account has no model yet, so start with "stack and images only"
        type: choice
        options: [stack and images only, full deploy]
        default: stack and images only
      model_uri:
        description: SageMaker MLflow App only. Registered model to deploy (full deploy; must already be promoted there). Ignored when MLflow runs on ECS
        default: models:/sepsis-warning@production
      model_version:
        description: MLflow on ECS only. Published model version to deploy (full deploy). Empty = the newest one the pipeline published and had approved
        default: ""

permissions:
  contents: read
  id-token: write   # OIDC token for AWS; no stored credentials

concurrency:
  group: deploy-${{ inputs.environment }}-${{ inputs.region }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    steps:
      - name: Resolve the region and the deploy role
        id: target
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          REGION_INPUT: ${{ inputs.region }}
          DEFAULT_REGION: ${{ vars.AWS_REGION }}
          ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          ROLE_ARN_VAR: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          region="$REGION_INPUT"
          [ "$region" != "environment default" ] || region="$DEFAULT_REGION"
          case "$region" in
            ap-southeast-1|ap-southeast-2) ;;
            *) echo "Region '$region' is not supported. Pick ap-southeast-1 or ap-southeast-2, or set AWS_REGION for the '$ENVIRONMENT' environment." >&2; exit 1 ;;
          esac
          if [ -n "$ROLE_ARN_VAR" ]; then
            role="$ROLE_ARN_VAR"
          elif [ -n "$ACCOUNT_ID" ]; then
            role="arn:aws:iam::${ACCOUNT_ID}:role/github-deploy-${ENVIRONMENT}-${region}"
          else
            echo "The '$ENVIRONMENT' environment has neither AWS_ACCOUNT_ID nor AWS_DEPLOY_ROLE_ARN." >&2
            echo "Run scripts/bootstrap_github_oidc.sh for this account, or set them in GitHub settings." >&2
            exit 1
          fi
          echo "region=$region" >> "$GITHUB_OUTPUT"
          echo "role=$role" >> "$GITHUB_OUTPUT"
          echo "Deploying '$ENVIRONMENT' to $region" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # The role's trust policy must match these claims exactly. Only the decoded claims are
      # printed, never the token. Because the job sets `environment:`, sub is
      # repo:<owner>/<name>:environment:<env> (unless the repo customised its subject template).
      - name: Show the OIDC claims AWS will check
        env:
          ROLE: ${{ steps.target.outputs.role }}
        run: |
          echo "role: $ROLE"
          curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c '
          import base64, json, sys
          part = json.load(sys.stdin)["value"].split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(part + "=" * (-len(part) % 4)))
          keys = ("sub", "aud", "iss", "repository", "environment", "ref", "job_workflow_ref")
          print(json.dumps({k: claims.get(k) for k in keys}, indent=2))' | tee -a "$GITHUB_STEP_SUMMARY" || true

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ steps.target.outputs.role }}
          aws-region: ${{ steps.target.outputs.region }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install the deploy tools (locked)
        run: |
          # The training lock holds MLflow at the App's version and sagemaker-mlflow, all with hashes.
          python -m pip install --require-hashes -r requirements/training.txt
          python -m pip install --no-deps -e .

      - name: Validate the templates and preview the stack (creates nothing)
        timeout-minutes: 20
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          CONFIRM_PROD: ${{ inputs.environment == 'prod' && 'yes' || '' }}
          AWS_REGION: ${{ steps.target.outputs.region }}
          BUDGET_EMAIL: ${{ vars.BUDGET_EMAIL }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          TAG: ${{ github.sha }}
        run: bash scripts/aws_deploy.sh validate

      # A full deploy needs a published, approved model. Find out now, not after the images are built.
      - name: Check that a model is ready to deploy (full deploy only)
        if: inputs.steps == 'full deploy'
        timeout-minutes: 5
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          CONFIRM_PROD: ${{ inputs.environment == 'prod' && 'yes' || '' }}
          AWS_REGION: ${{ steps.target.outputs.region }}
          BUDGET_EMAIL: ${{ vars.BUDGET_EMAIL }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          TAG: ${{ github.sha }}
          MODEL_VERSION: ${{ inputs.model_version }}
          MODEL_URI: ${{ inputs.model_uri }}
        run: bash scripts/aws_deploy.sh check-model

      - name: Stack and images
        timeout-minutes: 45
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          # Prod changes need this confirmation; the environment's required reviewers are the approval.
          CONFIRM_PROD: ${{ inputs.environment == 'prod' && 'yes' || '' }}
          AWS_REGION: ${{ steps.target.outputs.region }}
          BUDGET_EMAIL: ${{ vars.BUDGET_EMAIL }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          MODEL_URI: ${{ inputs.model_uri }}
          TAG: ${{ github.sha }}
          IMAGES_PARALLEL: "1"
        run: |
          bash scripts/aws_deploy.sh stack
          bash scripts/aws_deploy.sh images
          # The hosted tools (MLflow on ECS) need their image, which exists only after the first stack run:
          # this second run, a no-op when nothing changed, creates the service.
          bash scripts/aws_deploy.sh stack

      # CloudFormation says the stack is done when the services were created; this says the tools actually work.
      - name: Wait for the hosted tools to be running and healthy
        timeout-minutes: 20
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          CONFIRM_PROD: ${{ inputs.environment == 'prod' && 'yes' || '' }}
          AWS_REGION: ${{ steps.target.outputs.region }}
          BUDGET_EMAIL: ${{ vars.BUDGET_EMAIL }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          TAG: ${{ github.sha }}
        run: bash scripts/aws_deploy.sh ready

      - name: Publish the promoted model and serve it
        id: publish
        if: inputs.steps == 'full deploy'
        timeout-minutes: 20
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          CONFIRM_PROD: ${{ inputs.environment == 'prod' && 'yes' || '' }}
          AWS_REGION: ${{ steps.target.outputs.region }}
          BUDGET_EMAIL: ${{ vars.BUDGET_EMAIL }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          MODEL_VERSION: ${{ inputs.model_version }}
          MODEL_URI: ${{ inputs.model_uri }}
          TAG: ${{ github.sha }}
        run: |
          bash scripts/aws_deploy.sh publish
          bash scripts/aws_deploy.sh serve

      # The canary inside the stack update already rolled back on errors; this checks the result.
      - name: Smoke test the deployed API
        if: inputs.steps == 'full deploy'
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          AWS_REGION: ${{ steps.target.outputs.region }}
        run: |
          bash scripts/aws_deploy.sh call GET /health
          bash scripts/aws_deploy.sh call POST /predict \
            '{"stays": [{"patient_id": "smoke-1", "hours": [{"ICULOS": 1, "HR": 92}, {"ICULOS": 2, "HR": 118}]}]}'

      - name: Verify every deployed component
        if: always() && steps.target.outcome == 'success' && (inputs.steps != 'full deploy' || steps.publish.outcome == 'success')
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          AWS_REGION: ${{ steps.target.outputs.region }}
          TAG: ${{ github.sha }}
          FULL: ${{ inputs.steps == 'full deploy' && '--expect-model' || '' }}
        run: bash scripts/aws_deploy.sh verify $FULL

      # When anything above failed: the stack's failed events, then each service's state, stopped tasks and log tail.
      - name: Diagnose the failure
        if: failure() && steps.target.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          CONFIRM_PROD: ${{ inputs.environment == 'prod' && 'yes' || '' }}
          AWS_REGION: ${{ steps.target.outputs.region }}
          BUDGET_EMAIL: ${{ vars.BUDGET_EMAIL }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          TAG: ${{ github.sha }}
        run: bash scripts/aws_deploy.sh diagnose 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: What to do next
        if: always() && steps.target.outcome == 'success'
        run: |
          {
            echo "### Next"
            if [ "${{ job.status }}" = success ]; then
              if [ "${{ inputs.steps }}" = "full deploy" ]; then
                echo "- Show it: run the **demo** workflow. When finished, run **power** with \`stop\` so nothing bills."
              else
                echo "- Run **pipeline** (real data), then **promote** and **approve**, then deploy again with \`full deploy\`."
                echo "- First time on this account: copy PhysioNet to S3 once with the pipeline's prepare step."
              fi
            else
              echo "- Read the **Diagnose the failure** step above. It lists the stack failures and why each ECS task stopped."
              echo "- A stack left in \`UPDATE_ROLLBACK_FAILED\` or \`DELETE_FAILED\` needs a person: see docs/ecs-runbook.md, section Deploy states."
              echo "- Fixed it? Run **deploy** again; it cancels any update an earlier run left running."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
