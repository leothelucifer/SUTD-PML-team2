# Removes a deployment from AWS: pick the environment and region, then type the stack name to confirm.
# Started by hand only (Actions -> teardown -> Run workflow). Uses the same GitHub environments,
# variables and OIDC roles as the deploy workflow (see deploy.yml), so staging and prod wait for
# their required reviewers.
#
#   stack only   deletes the CloudFormation stack. Models, data, keys, images and logs are kept.
#   everything   also deletes the retained resources: both S3 buckets with every object version
#                (every published model and training output), the ECR repositories, the DynamoDB
#                table, the log groups, and schedules the KMS key for deletion in 7 days.
#                This cannot be undone.
name: 2 Env · teardown

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to remove (staging and prod wait for their reviewers)
        type: choice
        options: [dev, staging, prod]
        default: dev
      region:
        description: AWS region of the deployment to remove
        type: choice
        options: [environment default, ap-southeast-1, ap-southeast-2]
        default: environment default
      scope:
        description: What to remove
        type: choice
        options: [plan only, stack only, everything]
        default: plan only
      confirm:
        description: To remove anything, type the stack name (sepsis-dev, sepsis-staging or sepsis-prod)
        default: ""

permissions:
  contents: read
  id-token: write   # OIDC token for AWS; no stored credentials

concurrency:
  group: aws-ops-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  teardown:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    steps:
      - name: Check the confirmation
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          SCOPE: ${{ inputs.scope }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$SCOPE" != "plan only" ] && [ "$CONFIRM" != "sepsis-$ENVIRONMENT" ]; then
            echo "To run '$SCOPE' on $ENVIRONMENT, type sepsis-$ENVIRONMENT in the confirm box. Nothing was changed." >&2
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/aws-target
        id: target
        with:
          environment: ${{ inputs.environment }}
          region: ${{ inputs.region }}
          default-region: ${{ vars.AWS_REGION }}
          account-id: ${{ vars.AWS_ACCOUNT_ID }}
          role-arn: ${{ vars.AWS_DEPLOY_ROLE_ARN }}

      - name: Summarize target
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          AWS_REGION: ${{ steps.target.outputs.region }}
        run: echo "Teardown of '$ENVIRONMENT' in $AWS_REGION" >> "$GITHUB_STEP_SUMMARY"

      - uses: ./.github/actions/python-tools
        with:
          requirements-file: requirements/ci.txt

      - name: Plan, stack only, or everything
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          SCOPE: ${{ inputs.scope }}
          AWS_REGION: ${{ steps.target.outputs.region }}
          CONFIRM_PROD: ${{ inputs.environment == 'prod' && 'yes' || '' }}
        run: |
          case "$SCOPE" in
            "plan only") bash scripts/aws_deploy.sh destroy ;;
            "stack only") bash scripts/aws_deploy.sh down ;;
            everything) CONFIRM_DESTROY="sepsis-$ENVIRONMENT" bash scripts/aws_deploy.sh destroy ;;
          esac
