# Starts the model pipeline in AWS and follows it until it needs a person (the approval), finishes or fails:
#   prepare data (synthetic, or the PhysioNet download) -> hyperparameter search -> train + metrics report
#   -> approval email (token + report location) -> frozen evaluation -> publish to S3.
# Everything runs in SageMaker; this job only builds the images for this commit, starts the Step Functions
# execution and watches it. Uses the same GitHub environments, variables and OIDC roles as deploy.yml.
# After the approval, run the deploy workflow with steps "full deploy" to serve the published model.
name: 3 Model · pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to run in
        type: choice
        options: [dev, staging, prod]
        default: dev
      region:
        description: AWS region of the deployment
        type: choice
        options: [environment default, ap-southeast-1, ap-southeast-2]
        default: environment default
      action:
        description: start begins a run and ends (a real run takes hours; GitHub's AWS login lasts one hour). status shows the latest run and what is running. stop ends the running run.
        type: choice
        options: [start, status, stop]
        default: start
      data_source:
        description: synthetic = the software fixture (a rehearsal); physionet = the real data, copied from the open-data S3 bucket; physionet-web = the real data over HTTPS
        type: choice
        options: [synthetic, physionet, physionet-web]
        default: synthetic
      prepare:
        description: Build the data first (untick to reuse the data already in S3)
        type: boolean
        default: true
      limit:
        description: PhysioNet only. Stays per hospital to use, 0 = all
        default: "0"
      trials:
        description: Hyperparameter trials per model, 0 = keep the default settings
        default: "6"
      instance_type:
        description: SageMaker training instance type (ignored when the environment trains on ECS Fargate)
        default: "ml.m5.large"

permissions:
  contents: read
  id-token: write   # OIDC token for AWS; no stored credentials

concurrency:
  group: aws-ops-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/aws-target
        id: target
        with:
          environment: ${{ inputs.environment }}
          region: ${{ inputs.region }}
          default-region: ${{ vars.AWS_REGION }}
          account-id: ${{ vars.AWS_ACCOUNT_ID }}
          role-arn: ${{ vars.AWS_DEPLOY_ROLE_ARN }}

      - name: Summarize target
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          AWS_REGION: ${{ steps.target.outputs.region }}
        run: echo "Pipeline run for '$ENVIRONMENT' in $AWS_REGION" >> "$GITHUB_STEP_SUMMARY"

      - uses: ./.github/actions/python-tools
        with:
          requirements-file: requirements/ci.txt

      - name: Build the images for this commit (skipped when they already exist)
        if: inputs.action == 'start'
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          AWS_REGION: ${{ steps.target.outputs.region }}
          TAG: ${{ github.sha }}
        run: bash scripts/aws_deploy.sh images

      - name: Copy the PhysioNet data into our bucket (S3 to S3, no web download)
        if: inputs.action == 'start' && inputs.data_source == 'physionet' && inputs.prepare
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          AWS_REGION: ${{ steps.target.outputs.region }}
        run: bash scripts/aws_deploy.sh fetch-data

      - name: Start the pipeline
        if: inputs.action == 'start'
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          AWS_REGION: ${{ steps.target.outputs.region }}
          TAG: ${{ github.sha }}
          DATA_SOURCE: ${{ inputs.data_source }}
          PREPARE: ${{ inputs.prepare }}
          LIMIT: ${{ inputs.limit }}
          TRIALS: ${{ inputs.trials }}
          INSTANCE_TYPE: ${{ inputs.instance_type }}
          # Not followed: the run takes hours and this job's AWS login ends after one (run 5). The approval email comes
          # by itself; use action status to see the step it is in, and action stop to end it.
          WAIT: "0"
        run: |
          bash scripts/aws_deploy.sh pipeline
          {
            echo "### Started. It runs on its own in AWS (about 2 to 3 hours for the full real data)."
            echo "- Where it is: run this workflow again with action **status**."
            echo "- When it reaches the approval step an email arrives: then run **promote**, then **approve**."
            echo "- Not wanted any more: run this workflow with action **stop**."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show or stop the pipeline run
        if: inputs.action != 'start'
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          AWS_REGION: ${{ steps.target.outputs.region }}
          ACTION: ${{ inputs.action }}
        run: python scripts/aws_pipeline_status.py "$ACTION" --stack "sepsis-$ENVIRONMENT" --region "$AWS_REGION" | tee -a "$GITHUB_STEP_SUMMARY"
