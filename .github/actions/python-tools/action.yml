name: Set up locked Python tools
description: Set up Python and install a hash-locked requirements set and the local package
inputs:
  requirements-file:
    description: Hash-locked requirements file to install
    required: true
  python-version:
    description: Python version
    required: false
    default: "3.12"
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install locked dependencies and the package
      shell: bash
      env:
        REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
      run: |
        python -m pip install --require-hashes -r "$REQUIREMENTS_FILE"
        python -m pip install --no-deps -e .
